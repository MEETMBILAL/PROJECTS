<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Bookshelf.pk{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#FAFAF8;font-family:Helvetica,Arial,sans-serif;color:#1C1C1A;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFAF8;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border:1px solid #E2DDD5;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#2C4A3E;padding:24px 32px;">
                <h1 style="margin:0;color:#FAFAF8;font-size:24px;letter-spacing:0.5px;">Bookshelf.pk</h1>
                <p style="margin:4px 0 0;color:#DFB466;font-size:13px;">Pakistan's Most Trusted Bookstore</p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="background:#1C1C1A;padding:20px 32px;color:#9B9690;font-size:12px;">
                <p style="margin:0;">&copy; Bookshelf.pk — Books &amp; Print-on-Demand</p>
                <p style="margin:4px 0 0;">You are receiving this email because you have an account with us.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
