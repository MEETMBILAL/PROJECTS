services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bookshelf_db
      POSTGRES_USER: bookshelf_user
      POSTGRES_PASSWORD: bookshelf_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshelf_user -d bookshelf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./bookshelf_backend
      dockerfile: docker/Dockerfile.backend
    volumes:
      - ./bookshelf_backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ./bookshelf_backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://bookshelf_user:bookshelf_pass@db:5432/bookshelf_db
      REDIS_URL: redis://redis:6379/0

  celery:
    build:
      context: ./bookshelf_backend
      dockerfile: docker/Dockerfile.backend
    command: celery -A config worker -l info
    volumes:
      - ./bookshelf_backend:/app
    depends_on:
      - db
      - redis
    env_file: ./bookshelf_backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://bookshelf_user:bookshelf_pass@db:5432/bookshelf_db
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"

  frontend:
    build:
      context: ./bookshelf_frontend
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production

volumes:
  postgres_data:
