services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bookshelf_db
      POSTGRES_USER: bookshelf_user
      POSTGRES_PASSWORD: bookshelf_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshelf_user -d bookshelf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./bookshelf_backend
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./bookshelf_backend:/app
    ports:
      - "8000:8000"
    env_file: ./bookshelf_backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ./bookshelf_backend
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./bookshelf_backend:/app
    env_file: ./bookshelf_backend/.env
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./bookshelf_frontend
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production
    depends_on:
      - backend

volumes:
  postgres_data:
